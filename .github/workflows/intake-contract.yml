name: intake-contract

# Remote checks for the skill itself, running on every push and pull request.
#
# Be precise about what this is and is not:
#   * It runs server-side, so it cannot be skipped from a workstation the way the
#     corpus's local pre-commit hook can be skipped with --no-verify.
#   * It IS a required status check on main (see the repository's branch protection),
#     so a red run blocks the merge. That is enforcement, not merely presence.
#   * It only exists on the remote because this file is committed and pushed; a
#     workflow that lives in a working tree enforces nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The discovery suite runs the shipped browser adapter under node. The runner
      # image happens to ship one, but an undeclared dependency is one nobody notices
      # breaking — so declare it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Contract lint (SKILL.md, templates, README state the contract)
        run: python3 evals/contract_check.py

      - name: Approved-plan falsification suite
        run: python3 evals/test_plan_contract.py

      - name: Context-continuity suite (scenarios A–L, mutations, acceptance)
        run: python3 evals/test_context_v2.py

      - name: Living-context suite (C1–C15, source trust T1–T8, mutation matrix)
        run: python3 evals/test_context_v21.py

      - name: v3 suite (role-aware provenance, approval attestation, project sweep)
        run: python3 evals/test_project_v3.py

      - name: v3.1 transport suite (bounded chunks, exact digests, trust boundary)
        run: python3 evals/test_transport_v31.py

      - name: v3.1 discovery suite (cursor pagination against the real shipped adapter)
        run: node evals/test_discovery_v31.mjs

      - name: v4 RND_COMPILE suite (typed IR, coverage lens, laundering refusals)
        run: python3 evals/test_rnd_v4.py

      - name: v4.1 semantic-coverage suite (owner ledger, standing, progression, A–J)
        run: python3 evals/test_rnd_v41.py

      - name: Capture-signature goldens (structurally unavailable here — stated, not faked)
        run: |
          set -e
          # All three committed signatures are measured from transcripts that live
          # OUTSIDE this repo: two in the corpus, one gitignored as private chat content.
          # So this job can verify none of them, and saying so is the honest outcome —
          # the corpus workflow is where the two corpus goldens actually run.
          echo "goldens committed here: $(ls evals/golden/*.signature.json | wc -l)"
          echo "goldens verifiable in THIS workflow: 0 (sources are out of repo)"
          echo "Never regenerate a signature to make a check green; a golden is only"
          echo "updated from a new measurement of the real source."

      - name: Mutation guard — no suite may pass against a lobotomized validator
        run: |
          set -e
          mkdir -p /tmp/real && cp scripts/*.py /tmp/real/
          fail=0
          # Every combination of (mutated module, suite that DEPENDS on it). A suite
          # must FAIL — and must not silently exit 0 having executed nothing, which
          # the suites' own MIN_CHECKS floor turns into a non-zero exit. The three
          # v2-era suites never invoke project_contract, so that pairing is not a
          # dependency and is deliberately absent below.
          guard() {
            module="$1"; shift
            for suite in "$@"; do
              cp /tmp/real/*.py scripts/
              printf 'import sys\nsys.exit(0)\n' > "scripts/$module.py"
              if python3 "evals/$suite.py" > /tmp/mut.log 2>&1; then
                echo "MUTATION GUARD FAILED: $suite passed with $module stubbed out"
                fail=1
              else
                echo "ok: $suite fails with $module stubbed ($(grep -c '^PASS ' /tmp/mut.log || true) checks survived)"
              fi
            done
          }
          guard plan_contract    test_plan_contract test_context_v2 test_context_v21 test_project_v3
          guard context_contract test_plan_contract test_context_v2 test_context_v21 test_project_v3
          guard intake_common    test_plan_contract test_context_v2 test_context_v21 test_project_v3 test_rnd_v4
          guard project_contract test_project_v3
          guard reassemble_verify test_transport_v31
          guard rnd_contract     test_rnd_v4
          cp /tmp/real/*.py scripts/
          # The discovery suite runs the SHIPPED adapter, so its mutation is that file.
          # The v3 suite depends on it too: its enumeration-evidence fixtures are the
          # adapter's own output, which is the point — a hand-written record would only
          # have proved the checker agrees with the fixture.
          # Both capture scripts carry the transport digest Step 4 requires; the
          # discovery suite executes both, so each is its own mutation target.
          for js in extract data_capture; do
            cp "scripts/$js.js" "/tmp/real-$js.js"
            printf 'await (async function(){return JSON.stringify({});})()\n' > "scripts/$js.js"
            if node evals/test_discovery_v31.mjs > /tmp/mutjs.log 2>&1; then
              echo "MUTATION GUARD FAILED: discovery suite passed with $js.js stubbed"
              fail=1
            else
              echo "ok: discovery suite fails with $js.js stubbed"
            fi
            cp "/tmp/real-$js.js" "scripts/$js.js"
          done
          cp scripts/project_discovery.js /tmp/real-discovery.js
          printf 'await (async function(){return JSON.stringify({});})()\n' > scripts/project_discovery.js
          if node evals/test_discovery_v31.mjs > /tmp/mutjs.log 2>&1; then
            echo "MUTATION GUARD FAILED: discovery suite passed with the adapter stubbed"
            fail=1
          else
            echo "ok: discovery suite fails with project_discovery.js stubbed"
          fi
          if python3 evals/test_project_v3.py > /tmp/mutv3.log 2>&1; then
            echo "MUTATION GUARD FAILED: v3 suite passed with the adapter stubbed"
            fail=1
          else
            echo "ok: v3 suite fails with project_discovery.js stubbed"
          fi
          cp /tmp/real-discovery.js scripts/project_discovery.js
          git diff --quiet -- scripts/project_discovery.js || { echo "GUARD DID NOT RESTORE the adapter"; exit 1; }
          # And the specific shape that used to slip through: a stub that still IMPORTS
          # cleanly but answers nothing.
          printf 'import sys\ndef main(argv=None):\n    print("PASS")\n    return 0\nif __name__ == "__main__":\n    sys.exit(main())\n' > scripts/context_contract.py
          for suite in test_context_v2 test_context_v21; do
            if python3 "evals/$suite.py" > /tmp/mut2.log 2>&1; then
              echo "MUTATION GUARD FAILED: $suite passed against an inert context_contract"
              fail=1
            fi
          done
          cp /tmp/real/*.py scripts/
          git diff --quiet -- scripts/ || { echo "GUARD DID NOT RESTORE scripts/"; exit 1; }
          exit $fail
